[project]
name = "aurora"
version = "0.1.0"
description = "A Python teaching assistant prototype for analog electronics"
readme = "README.md"
authors = [
    { name = "kyle", email = "zsq061219@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not online and not ai_eval and not slow'"
markers = [
    "online: accesses a real external API and requires explicit enablement",
    "ai_eval: runs non-deterministic AI capability evaluation",
    "slow: takes materially longer than the default offline suite",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
